<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Enerpack HR</title>
    <meta name="description" content="Enerpack HR - Enterprise HR, Attendance, and Workforce Management System" />
    <meta property="og:title" content="Enerpack HR" />
    <meta property="og:description" content="Enerpack HR - Enterprise HR, Attendance, and Workforce Management System" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function(){
        try {
          var redirect = null;
          try {
            redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
          } catch (storageErr) {}

          if (!redirect) {
            var params = new URLSearchParams(window.location.search);
            var queryRedirect = params.get('redirect');
            if (queryRedirect) {
              redirect = decodeURIComponent(queryRedirect);
            }
          }

          if (redirect && redirect !== window.location.href) {
            window.history.replaceState(null, null, redirect);
          }
        } catch (e) {
          console.warn('Navigation redirect state error:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
