<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Enerpack HR</title>
    <script>
      (function() {
        var path = window.location.pathname || '/';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        
        try {
          sessionStorage.redirect = window.location.href;
        } catch(e) {}
        
        // Pass target as query param in case sessionStorage is restricted in cross-origin iframes
        var target = '/?redirect=' + encodeURIComponent(path + search + hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="margin: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div style="text-align: center; color: #64748b;">
      <div style="width: 36px; height: 36px; border: 3px solid #2563eb; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px auto;"></div>
      <p style="font-size: 13px; font-weight: 600; margin: 0; color: #334155;">Loading Enerpack HR...</p>
    </div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
